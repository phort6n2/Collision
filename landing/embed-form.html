<!-- ============================================================================
     EMBEDDABLE QUOTE FORM — source

     Built by build-pages.cjs into quote-site/embed/form.html. That output IS
     the paste-in snippet: copy the whole file into a WordPress "Custom HTML"
     block. Loading the URL renders a working preview of the same code.

     WHY THIS FILE EXISTS SEPARATELY FROM template.html

     The landing form lives inside a page we control end to end. This one is
     dropped into somebody else's WordPress theme, and that changes three things
     it cannot share:

       - It renders into a SHADOW ROOT. WordPress themes and page builders style
         `input`, `button`, `select` and `.form-control` globally and with high
         specificity. Scoped class names are not enough — a theme that sets
         `input { width: 100% !important }` wins against any prefix we pick.
         A shadow root is the only isolation that holds in both directions.
       - Every URL is ABSOLUTE. There is no /ASSET/ rewrite on a foreign origin,
         and a root-relative /privacy would resolve against the WordPress site.
       - It reports NO Google Ads conversion and loads no gtag. Ads point at the
         landing domain; a submission here has no click ID, so Google would
         discard it — except where enhanced conversions match the person to an
         older ad click, which would credit the landing page for a lead it did
         not earn. Measuring organic volume is the leads app's job.

     THE DRIFT PROBLEM, STATED

     This is a paste-in snippet, so the copy living in WordPress is a SNAPSHOT.
     Change this file and WordPress keeps serving the old one until someone
     re-pastes. Two things make that survivable and neither removes the risk:

       - The build stamps a version comment at the top of the output. Compare it
         against what is in WordPress to know whether they match.
       - verify.cjs asserts this file's field set and payload keys against the
         landing form's, so the two cannot silently diverge IN THE REPO. It
         cannot see what is actually pasted into WordPress. Nothing can.

     Anything changed here needs re-pasting. Say so when you change it.
     ============================================================================ -->

<script>
(function(){

    '#qcMore{ border:1px solid var(--line-card); border-top:0; border-radius:0 0 var(--r-sm) var(--r-sm);',

    '.btn{',
    '  display:inline-flex; align-items:center; justify-content:center; gap:10px; font:inherit;',

  /* ---------------------------------------------------------------- markup */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  /* Both links are optional and independent. Each is emitted only when its URL

     sentence that still reads correctly rather than a dangling "and". */

    if(TERMS_URL)   parts.push('<a href="' + esc(TERMS_URL)   + '">Terms</a>');
    if(!parts.length) return '';
    return ' See our ' + parts.join(' and ') + '.';

  var callLink = PHONE_E164
    ? '<a href="tel:' + esc(PHONE_E164) + '">' + esc(PHONE_DISP) + '</a>'
    : '';

  var HTML =
    '<div class="wrap">' +
      '<form id="quoteForm" novalidate method="post">' +
        '<h2 class="qc-h">Get your free quote</h2>' +
        '<p class="qc-sub">Takes about 30 seconds. We\'ll confirm your glass and your coverage before anyone is dispatched.</p>' +
        '<div class="qc-row qc-row-2">' +
          '<div class="field"><label class="label" for="nm">Full name<span class="req" aria-hidden="true">*</span></label>' +
            '<input class="input" id="nm" name="name" type="text" autocomplete="name" required placeholder="Alex Ramirez">' +

          '<div class="field"><label class="label" for="veh">Vehicle<span class="req" aria-hidden="true">*</span></label>' +

        /* Honeypot. display:none is load-bearing, not incidental: Chrome's
           address-profile autofill SKIPS display:none and visibility:hidden but

        '<div class="hp" aria-hidden="true">' +

  /* Everything below queries the SHADOW ROOT, never the document. getElementById
     does not exist on a shadow root and document.getElementById cannot see into
     one — this is the single most likely way an edit ported from the landing
     page breaks here, and it breaks silently: the query returns null and the
     field simply stops validating. */
  function $(id){ return root.getElementById ? root.getElementById(id) : root.querySelector('#' + id); }

     Same capture as the landing page. Kept even though this domain receives no
     ad traffic: a stray click ID still tells the truth about that visitor, and
     paid_click is how a workflow can tell a genuinely organic lead from one
     that arrived on an ad despite the domain. Namespaced key — sessionStorage
     is per-origin and this origin belongs to somebody else's site. */
  var ATTR_KEYS = ['gclid','gbraid','wbraid','gclsrc','msclkid','fbclid','ttclid','li_fat_id',
                   'utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
  var attribution = (function(){
    var store = {};
    try{ store = JSON.parse(sessionStorage.getItem('cag_attr') || '{}'); }catch(e){ store = {}; }
    var qs = new URLSearchParams(location.search), touched = false;
    ATTR_KEYS.forEach(function(k){
      var v = qs.get(k);
      if(v){ store[k] = v; touched = true; }      // newest click wins
    });
    if(!store.landing_page){ store.landing_page = location.href.split('#')[0]; touched = true; }
    if(!store.referrer){ store.referrer = document.referrer || ''; touched = true; }
    if(touched){ try{ sessionStorage.setItem('cag_attr', JSON.stringify(store)); }catch(e){} }
    return store;
  })();

  /* ------------------------------------------------------------ formatting */
  function phDigits(v){
    var d = String(v || '').replace(/\D/g,'');
    if(d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    return d.slice(0,10);
  }
  function phFormat(d){
    if(!d) return '';
    if(d.length < 4) return '(' + d;
    if(d.length < 7) return '(' + d.slice(0,3) + ') ' + d.slice(3);
    return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
  }
  function phE164(v){ var d = phDigits(v); return d.length === 10 ? '+1' + d : ''; }

  var phEl = $('ph');
  phEl.setAttribute('maxlength','14');
  phEl.addEventListener('input', function(){ this.value = phFormat(phDigits(this.value)); });
  $('zip').addEventListener('input', function(){ this.value = this.value.replace(/\D/g,'').slice(0,5); });

  /* VIN: real VINs are uppercase and never contain I, O or Q — they would be
     mistaken for 1 and 0 — so filter those as they type. */
  var vinEl = $('vin'), vinHint = $('vinHint');
  vinEl.addEventListener('input', function(){
    var v = this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'').slice(0,17);
    this.value = v;
    if(!v){ vinHint.style.display = 'none'; this.style.borderColor = ''; return; }
    vinHint.style.display = 'block';
    if(v.length === 17){
      this.style.borderColor = 'var(--success)';
      vinHint.textContent = '✓ Looks like a valid VIN'; vinHint.style.color = 'var(--success)';
    } else {
      this.style.borderColor = '';
      vinHint.textContent = v.length + ' of 17 characters'; vinHint.style.color = 'var(--text-muted)';
    }
  });

  /* ------------------------------------------------------------- drawer */
  var expand = $('qcExpand'), more = $('qcMore');
  expand.addEventListener('click', function(){
    var open = expand.getAttribute('aria-expanded') === 'true';
    expand.setAttribute('aria-expanded', open ? 'false' : 'true');
    more.hidden = open;
  });
  var carrierField = $('carrierField');
  root.querySelectorAll('input[name="insurance"]').forEach(function(r){
    r.addEventListener('change', function(){ carrierField.hidden = r.value !== 'yes'; });
  });

  /* --------------------------------------------------------- validation */
  var RULES = [
    { el:'nm',  err:'nm-err',  msg:'Enter your name so we know who to ask for.',
      ok:function(v){ return v.trim().length >= 2; } },
    { el:'ph',  err:'ph-err',  msg:'Enter a 10-digit mobile number so we can call you back.',
      ok:function(v){ return phDigits(v).length === 10; } },
    { el:'em',  err:'em-err',  msg:'Enter a valid email address.',
      ok:function(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); } },
    { el:'zip', err:'zip-err', msg:'Enter the 5-digit ZIP where the vehicle is.',
      ok:function(v){ return /^\d{5}$/.test(v.trim()); } },
    { el:'svc', err:'svc-err', msg:'Tell us which glass you need.',
      ok:function(v){ return !!v; } },
    /* Year make model. Two words minimum, so "car" and "." do not pass — a
       vehicle we cannot identify is a vehicle we cannot quote. */
    { el:'veh', err:'veh-err', msg:'Add the year, make and model, e.g. 2021 Toyota RAV4.',
      ok:function(v){ return v.trim().replace(/\s+/g,' ').split(' ').length >= 2 && v.trim().length >= 6; } }
  ];

  function setErr(rule, show){
    var el = $(rule.el), box = $(rule.err);
    if(!el || !box) return;
    if(show){
      el.setAttribute('aria-invalid','true');
      el.setAttribute('aria-describedby', rule.err);
      box.textContent = rule.msg; box.classList.add('on');
    } else {
      el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby');
      box.textContent = ''; box.classList.remove('on');
    }
  }

  /* Validate on blur, never on keydown — premature errors read as hostile.
     Once a field is already in error, re-validate on input so it clears as soon
     as they fix it. */
  RULES.forEach(function(rule){
    var el = $(rule.el);
    if(!el) return;
    el.addEventListener('blur', function(){ if(el.value.trim()) setErr(rule, !rule.ok(el.value)); });
    el.addEventListener('input', function(){
      if(el.getAttribute('aria-invalid') === 'true' && rule.ok(el.value)) setErr(rule, false);
    });
  });

  /* ------------------------------------------------------------- panels */
  function showSuccess(first){
    var echo = $('echoName');
    if(echo) echo.textContent = first;
    form.style.display = 'none';
    var ok = $('quoteSuccess');
    ok.classList.add('on');
    var head = $('okHead');
    if(head) head.focus();
    /* Scroll the HOST, not the panel. A shadow-root node's scrollIntoView is
       fine, but the mount point is what the WordPress page's own layout knows
       about, and sticky headers on their theme measure against it. */
    try{ MOUNT.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
  }
  function showError(){
    submitting = false;
    submitBtn.removeAttribute('aria-disabled');
    submitBtn.disabled = false;
    submitBtn.style.pointerEvents = '';
    if(btnLabel) btnLabel.textContent = origLabel;
    form.removeAttribute('aria-busy');
    /* Clear the polite live region, or a screen reader is left with
       "Sending your request…" contradicting the alert box. */
    if(statusEl) statusEl.textContent = '';
    errBox.innerHTML = 'Sorry &mdash; that didn’t go through. Please call ' +
      (callLink || 'us') + ' and we’ll take the details over the phone.';
    errBox.classList.add('on');
  }

  /* A real re-entrancy guard. aria-disabled is advisory and pointer-events:none
     only blocks mouse and touch, so pressing Enter three times in any field
     posts three times — three CRM contacts, three workflow triggers, three
     outbound calls to one impatient person. */
  var submitting = false;

  /* Bot signal: a human cannot submit without generating a trusted pointerdown
     or keydown inside the form. A script that sets .value and calls click()
     generates neither. Deliberately NOT a time threshold — browser autofill can
     populate the whole form in one tap, and dropping that visitor would lose a
     real lead and show them a success screen that lied. A false negative costs
     one junk row in the CRM; a false positive costs a customer. */
  var interacted = false;
  function sawUser(e){ if(e.isTrusted) interacted = true; }
  form.addEventListener('pointerdown', sawUser, true);
  form.addEventListener('keydown', sawUser, true);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(submitting) return;
    errBox.classList.remove('on');

    var nm = $('nm'), em = $('em'), ph = $('ph'), zip = $('zip');
    var fullName = (nm.value || '').trim();
    var first = fullName.split(/\s+/)[0] || 'there';

    /* Show the normal success screen rather than an error — telling a bot why it
       failed is how it learns to pass. Nothing is POSTed. */
    var hp = $('hp_check');
    if((hp && hp.value) || !interacted){
      try{ console.info('[cag] not sent — submit failed the bot check (honeypot=' +
           !!(hp && hp.value) + ', trusted interaction=' + interacted + ')'); }catch(err){}
      showSuccess(first);
      return;
    }

    var bad = [];
    RULES.forEach(function(rule){
      var el = $(rule.el);
      var invalid = !el || !rule.ok(el.value);
      setErr(rule, invalid);
      if(invalid) bad.push(rule);
    });
    if(bad.length){
      statusEl.textContent = bad.length + (bad.length === 1 ? ' field needs' : ' fields need') + ' attention.';
      var firstBad = $(bad[0].el);
      if(firstBad) firstBad.focus();
      /* Naming the field turns "the form does not work" into something
         answerable without reproducing it. */
      try{ console.info('[cag] not sent — validation stopped the submit: ' +
           bad.map(function(b){ return b.el; }).join(', ')); }catch(err){}
      return;
    }

    var parts = fullName.split(/\s+/);
    var insEl = root.querySelector('input[name="insurance"]:checked');
    var payload = {
      full_name: fullName,
      first_name: parts[0] || fullName,
      last_name: parts.slice(1).join(' '),
      email: (em.value || '').trim(),
      phone: phE164(ph.value),
      phone_formatted: (ph.value || '').trim(),
      postal_code: (zip.value || '').trim(),
      vehicle: ($('veh').value || '').trim(),
      vin: (vinEl.value || '').trim(),
      service: $('svc').value,
      insurance: insEl ? insEl.value : '',
      carrier: $('carrier').value || '',
      source: SOURCE_TAG,
      /* CRM standard field — becomes the contact's Source. */
      contact_source: CONTACT_SOURCE,
      /* contact_source says what this SITE is for; paid_click says whether this
         particular visitor actually arrived on an ad click. They disagree for a
         visitor who clicked an ad and then navigated here, and only this one
         can tell you so. */
      paid_click: (attribution.gclid || attribution.gbraid || attribution.wbraid) ? 'yes' : 'no',
      page_path: location.pathname,
      page: location.href,
      submitted_at: new Date().toISOString()
    };
    ATTR_KEYS.concat(['landing_page','referrer']).forEach(function(k){
      payload[k] = attribution[k] || '';
    });

    submitting = true;
    submitBtn.setAttribute('aria-disabled','true');
    submitBtn.disabled = true;
    submitBtn.style.pointerEvents = 'none';
    if(btnLabel) btnLabel.textContent = 'Sending…';
    form.setAttribute('aria-busy','true');
    statusEl.textContent = 'Sending your request…';

    /* Bound the wait. A bare fetch has no timeout, so a webhook that accepts the
       connection and never answers leaves the button reading "Sending…" forever
       with no error and no delivered lead. On abort we fall through to
       showError, which tells them to call instead. */
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 10000);

    /* ---- additive copy to the leads app ----
       Started here so both requests are in flight together. Not awaited, not
       chained: the CRM alone decides what the visitor sees.

       Its own AbortController. Sharing the one above would mean this request's
       timeout aborts the CRM request too, turning a best-effort extra into a way
       to lose the lead that matters.

       The catch swallows everything. It must never call showError, never block
       showSuccess, never touch the button, aria-busy or the status text. */
    if(LEAD_APP_WEBHOOK){
      (function(){
        var appCtrl = ('AbortController' in window) ? new AbortController() : null;
        var appTimer = setTimeout(function(){ if(appCtrl) appCtrl.abort(); }, 10000);
        fetch(LEAD_APP_WEBHOOK, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload),
          keepalive: true,
          signal: appCtrl ? appCtrl.signal : undefined
        })
        .then(function(res){
          if(!res.ok) try{ console.warn('[cag] leads-app HTTP ' + res.status); }catch(err){}
        })
        .catch(function(err){ try{ console.warn('[cag] leads-app post failed', err); }catch(e2){} })
        .then(function(){ clearTimeout(appTimer); });
      })();
    }

    if(!LEAD_WEBHOOK){ clearTimeout(timer); showSuccess(first); return; }

    fetch(LEAD_WEBHOOK, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(res){
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      statusEl.textContent = 'Request sent.';
      showSuccess(first);
    })
    .catch(function(){
      clearTimeout(timer);
      showError();
    });
  });
})();
</script>

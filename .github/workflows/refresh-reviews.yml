name: Refresh Google reviews

# Pulls the real Google rating, review count and quotes once a week and bakes
# them into the generated site. One Places API call per week — visitors never
# touch the API and the key never reaches the browser.
#
# NOTE: scheduled workflows only run from the DEFAULT branch. On a feature
# branch GitHub does not register this workflow at all — it won't appear in the
# Actions tab and cannot be dispatched. Merge to the default branch before
# expecting the cron to fire.

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}   # optional override; default is baked into the script
        run: node landing/fetch-reviews.cjs

      - name: Rebuild site
        run: npm run build:landing

      - name: Verify build
        run: npm run verify

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landing/reviews.json quote-site
          git diff --cached --quiet && echo "No review changes." && exit 0
          git commit -m "Refresh Google reviews"
          git push
